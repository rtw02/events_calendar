<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fall Social</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --glass:   rgba(6,11,24,0.88);
    --glass2:  rgba(255,255,255,0.06);
    --border:  rgba(255,255,255,0.13);
    --ink:     #e8eaf0;
    --ink-2:   rgba(232,234,240,0.70);
    --ink-3:   rgba(232,234,240,0.38);
    --accent:  #5EBF8A;
    --success: #5EBF8A;
    --success-bg:     rgba(94,191,138,0.32);
    --success-border: rgba(94,191,138,0.60);
    --success-text:   #5EBF8A;
    --orange: #E8884A;
    --upstate:      #5EBF8A;
    --fair:         #E8884A;
    --halloween:    #B07FD8;
    --friendsgiving:#E87878;
    --other:        #78AADC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: #080e1c; overflow-y: auto; }

  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; background-image: url('/bg.jpg'); background-size: cover; background-position: center 75%; animation: slowZoom 60s ease-in-out infinite alternate; }
  @keyframes slowZoom { from { transform: scale(1.0); } to { transform: scale(1.06); } }

  #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

  .hdr { display: flex; flex-direction: column; gap: 6px; padding: 18px 24px 14px; background: rgba(8,14,28,0.60); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .hdr-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .hdr-eyebrow { font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .hdr-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .hl { color: var(--accent); }
  .sub { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 8px; letter-spacing: 0; }
  .stats { display: flex; gap: 18px; }
  .stat { text-align: center; }
  .stat-n { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-l { font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .tab-row { display: flex; gap: 4px; }
  .tab-btn { font-size: 10.5px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink-3); cursor: pointer; transition: all 0.15s; }
  .tab-btn.active { background: rgba(255,255,255,0.14); color: var(--ink); border-color: rgba(255,255,255,0.2); }
  .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.08); }

  .main { display: flex; flex: 1; min-height: 520px; overflow: hidden; }
  .months-wrap { flex: 1; display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; overflow-y: auto; background: rgba(4,8,20,0.45); }
  .months-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .nav-btn { background: var(--glass2); border: 1px solid var(--border); color: var(--ink-2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  #nav-range { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.04em; }
  .months { display: flex; gap: 12px; }
  .month-block { flex: 1; }
  .month-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .month-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .goal-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
  .goal-bar { height: 4px; flex: 1; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; min-width: 40px; }
  .goal-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }
  .goal-label { font-size: 9px; color: var(--ink-3); white-space: nowrap; }
  .goal-set-btn { font-size: 9px; font-weight: 600; color: var(--ink-3); background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 10px; padding: 2px 7px; cursor: pointer; white-space: nowrap; }
  .goal-set-btn:hover { color: var(--ink-2); }
  .dow-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 3px; }
  .dow { text-align: center; font-size: 8.5px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.06em; }
  .day-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .tile { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 7px; cursor: pointer; position: relative; background: var(--glass); border: 1px solid var(--border); transition: background 0.12s, border-color 0.12s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s; overflow: hidden; gap: 1px; }
  .tile.empty { background: transparent; border-color: transparent; cursor: default; }
  .tile.past { opacity: 0.45; cursor: default; }
  .tile.past.success { opacity: 0.72; }
  .tile.today { border-color: rgba(255,255,255,0.85) !important; border-width: 2px !important; animation: todayPulse 2s ease-in-out infinite; }
  @keyframes todayPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.45) !important; } 50% { box-shadow: 0 0 0 3px rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.9) !important; } }
  .tile.success { background: var(--success-bg); border-color: var(--success-border); }
  .tile.success.pulse-in { animation: successPulse 0.5s ease-out; }
  @keyframes successPulse { 0%,100% { box-shadow: none; } 40% { box-shadow: 0 0 0 4px rgba(94,191,138,0.35); } }
  .tile.gcal-only { background: rgba(160,200,255,0.07); border-color: rgba(160,200,255,0.22); }
  .tile.selected { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
  .tile:not(.past):not(.empty):hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); transform: scale(1.06) translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  .tile.stagger { animation: tileIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes tileIn { from { opacity: 0; transform: scale(0.78); } to { opacity: 1; transform: scale(1); } }
  .ripple { position: absolute; width: 6px; height: 6px; background: rgba(255,255,255,0.45); border-radius: 50%; transform: translate(-50%,-50%) scale(0); animation: rippleOut 0.55s ease-out forwards; pointer-events: none; }
  @keyframes rippleOut { to { transform: translate(-50%,-50%) scale(22); opacity: 0; } }
  .dn { font-size: 11px; font-weight: 600; color: var(--ink); line-height: 1; }
  .tile.past .dn { color: var(--ink-3); }
  .dots { display: flex; gap: 1.5px; flex-wrap: wrap; justify-content: center; max-width: 26px; }
  .dot { width: 3.5px; height: 3.5px; border-radius: 50%; flex-shrink: 0; }
  .dot.tentative-dot { border: 1px dashed rgba(255,255,255,0.4); background: transparent !important; }
  .gcal-badge { position: absolute; top: 2px; right: 3px; font-size: 7px; font-weight: 700; color: rgba(160,200,255,0.9); line-height: 1; }
  .wx-badge { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 1px; pointer-events: none; }
  .wx-emoji { font-size: 9px; line-height: 1; }
  .wx-temp { font-size: 7.5px; font-weight: 600; color: var(--ink-3); line-height: 1; }
  .tile.past .wx-temp { opacity: 0.5; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .hm-cell { aspect-ratio: 1; border-radius: 2px; cursor: default; transition: opacity 0.15s; }
  .hm-cell:hover { opacity: 0.8; }
  /* ── Responsive ──────────────────────────────────────── */

  /* Portrait orientation: vertical monitors, tablets in portrait */
  @media (orientation: portrait) {
    .months { flex-direction: column; }
    .month-block { flex: none; }
    .main { flex-direction: column; overflow-y: auto; min-height: 0; }
    .months-wrap { overflow-y: visible; }
    /* panel slides up from bottom as a sheet */
    .panel-wrap { width: 100% !important; border-left: none !important; border-top: 1px solid transparent;
      transition: max-height 0.32s cubic-bezier(0.4,0,0.2,1), border-color 0.2s, opacity 0.28s, transform 0.32s cubic-bezier(0.4,0,0.2,1) !important;
      max-height: 0; overflow: hidden; opacity: 0; transform: translateY(12px); flex-shrink: 0; }
    .panel-wrap.open { width: 100% !important; max-height: 55vh; border-top-color: var(--border); opacity: 1; transform: translateY(0); }
    .panel { width: 100% !important; max-height: 55vh; box-sizing: border-box; }
  }

  /* Narrow landscape (600–900px wide, landscape) */
  @media (orientation: landscape) and (max-width: 900px) {
    .months { flex-direction: column; }
    .month-block { flex: none; }
    .panel-wrap.open { width: 200px; }
    .panel { width: 200px; }
  }

  /* Medium landscape (900–1100px): slightly narrower panel */
  @media (orientation: landscape) and (min-width: 901px) and (max-width: 1100px) {
    .panel-wrap.open { width: 230px; }
    .panel { width: 230px; }
  }

  /* Mobile (< 540px): compact header, bottom sheet panel */
  @media (max-width: 540px) {
    .hdr { padding: 10px 12px 8px; }
    .months-wrap { padding: 6px 8px; }
    .tile { min-width: 0; }
    .stats { gap: 10px; }
    .stat-n { font-size: 16px; }
    .hdr-title { font-size: 18px; }
    /* Override portrait sheet to be taller on small screens */
    .panel-wrap.open { max-height: 65vh !important; }
    .panel { max-height: 65vh !important; }
  }

  .panel-wrap { width: 0; flex-shrink: 0; overflow: hidden; border-left: 1px solid transparent; transition: width 0.32s cubic-bezier(0.4,0,0.2,1), border-color 0.2s ease, opacity 0.28s ease, transform 0.32s cubic-bezier(0.4,0,0.2,1); opacity: 0; transform: translateY(10px); }
  .panel-wrap.open { width: 260px; border-left-color: var(--border); opacity: 1; transform: translateY(0); }
  .panel { width: 260px; background: rgba(4,8,20,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 80px); }
  .panel-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 8px; opacity: 0.4; }
  .panel-empty-icon { font-size: 32px; }
  .panel-empty-text { font-size: 11px; color: var(--ink-3); text-align: center; }
  .panel-head { margin-bottom: 2px; }
  .panel-date { font-size: 14px; font-weight: 700; color: var(--ink); }
  .panel-dow { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .section-label { font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .plans-section { display: flex; flex-direction: column; gap: 4px; }
  .plan-item { display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--border); animation: planSlide 0.22s cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes planSlide { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  @keyframes statCount { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .streak-fire { color: var(--orange) !important; text-shadow: 0 0 10px rgba(232,136,74,0.7), 0 0 24px rgba(232,136,74,0.35); }
  .months-slide { animation: monthsIn 0.28s cubic-bezier(0.4,0,0.2,1) both; }
  .months-slide-left { animation: monthsInLeft 0.28s cubic-bezier(0.4,0,0.2,1) both; }
  @keyframes monthsIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes monthsInLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .goal-fill { transition: width 0.7s cubic-bezier(0.4,0,0.2,1) !important; }
  .plan-item:last-child { border-bottom: none; }
  .plan-tentative { opacity: 0.65; }
  .plan-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .plan-info { flex: 1; min-width: 0; }
  .plan-name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .plan-meta { font-size: 9.5px; color: var(--ink-3); margin-top: 1px; }
  .plan-notes { font-size: 9.5px; color: var(--ink-3); font-style: italic; margin-top: 1px; }
  .plan-friend { font-size: 9px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .plan-actions { display: flex; gap: 2px; align-items: flex-start; flex-shrink: 0; }
  .plan-mv, .plan-edit { background: none; border: none; color: var(--ink-3); font-size: 10px; cursor: pointer; padding: 1px 3px; line-height: 1; }
  .plan-mv:hover { color: var(--ink-2); }
  .plan-edit:hover { color: var(--accent); }
  .plan-del { background: none; border: none; color: var(--ink-3); font-size: 14px; cursor: pointer; line-height: 1; padding: 0 2px; }
  .plan-del:hover { color: #E87878; }
  .gcal-section { display: flex; flex-direction: column; gap: 3px; }
  .gcal-event { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .gcal-icon { font-size: 9px; flex-shrink: 0; }
  .gcal-title { font-size: 10.5px; color: var(--ink-2); flex: 1; }
  .gcal-label { font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(160,200,255,0.6); background: rgba(160,200,255,0.1); border: 1px solid rgba(160,200,255,0.2); border-radius: 10px; padding: 1px 5px; flex-shrink: 0; }
  .mcp-status { font-size: 9.5px; color: var(--ink-3); font-style: italic; }
  .add-section { display: flex; flex-direction: column; gap: 6px; }
  .add-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12px; color: var(--ink); outline: none; font-family: inherit; }
  .add-input:focus { border-color: rgba(255,255,255,0.25); }
  .plan-row2 { display: flex; gap: 6px; }
  .add-input-sm { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; font-size: 11px; color: var(--ink); outline: none; min-width: 0; font-family: inherit; }
  .add-input-sm:focus { border-color: rgba(255,255,255,0.25); }
  .cat-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat-btn { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink-2); cursor: pointer; transition: all 0.1s; white-space: nowrap; }
  .friend-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .friend-toggle input[type=checkbox] { display: none; }
  .toggle-track { width: 28px; height: 15px; border-radius: 8px; background: rgba(255,255,255,0.12); border: 1px solid var(--border); position: relative; flex-shrink: 0; transition: background 0.15s; }
  .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: rgba(232,234,240,0.5); transition: transform 0.15s, background 0.15s; }
  .friend-toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
  .friend-toggle input:checked + .toggle-track::after { transform: translateX(13px); background: #000; }
  .toggle-label { font-size: 10.5px; color: var(--ink-2); }
  .btn-row { display: flex; gap: 6px; }
  .add-btn { width: 100%; padding: 8px; background: rgba(94,191,138,0.15); border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .add-btn:hover { background: rgba(94,191,138,0.25); }
  .add-btn:disabled { opacity: 0.5; cursor: default; }
  .cancel-btn { flex: 1; padding: 7px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .friend-pick-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .friend-chip { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink-2); cursor: pointer; transition: all 0.1s; }
  .friend-chip.active { color: #000; }
  .sugg-section { display: flex; flex-direction: column; gap: 5px; }
  .sugg-item { padding: 7px 9px; background: var(--glass2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 0.1s; }
  .sugg-item:hover { background: rgba(255,255,255,0.08); }
  .sugg-title { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .sugg-desc { font-size: 10px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }
  .sugg-cat { display: inline-block; font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: 10px; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
  .sugg-loading { font-size: 10.5px; color: var(--ink-3); font-style: italic; }
  .recap-btn { width: 100%; padding: 8px; background: rgba(200,168,75,0.10); border: 1px solid rgba(200,168,75,0.3); border-radius: 8px; color: rgba(200,168,75,0.9); font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .recap-btn:hover { background: rgba(200,168,75,0.18); }
  .recap-text { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; padding: 10px; background: rgba(255,255,255,0.04); border-radius: 8px; border: 1px solid var(--border); white-space: pre-wrap; }
  .freq-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .freq-row:last-child { border-bottom: none; }
  .freq-name { font-size: 11.5px; color: var(--ink-2); width: 90px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .freq-bar-wrap { flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .freq-bar { height: 100%; border-radius: 4px; min-width: 4px; transition: width 0.4s; }
  .freq-count { font-size: 10.5px; color: var(--ink-3); width: 20px; text-align: right; flex-shrink: 0; }
  .friend-manage-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .legend { display: flex; align-items: center; gap: 10px; padding: 7px 18px; background: rgba(8,14,28,0.40); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 500; color: var(--ink-3); }
  .leg-dot { width: 6px; height: 6px; border-radius: 50%; }
  .leg-sep { width: 1px; height: 13px; background: var(--border); }
  .success-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--success-text); background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 20px; padding: 2px 7px; }
  .export-btn { font-size: 9.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink-3); cursor: pointer; }
  .export-btn:hover { background: rgba(255,255,255,0.10); color: var(--ink-2); }
  .gap-alert { font-size: 10px; font-weight: 600; color: var(--orange); background: rgba(232,136,74,0.12); border: 1px solid rgba(232,136,74,0.3); border-radius: 20px; padding: 2px 10px; }
  .spacer { position: relative; z-index: 1; height: 70vh; pointer-events: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header class="hdr">
    <div class="hdr-top">
      <div>
        <div class="hdr-eyebrow">Personal Calendar · New York</div>
        <div class="hdr-title">Fall <span class="hl">Social</span><span class="sub">Sept – Nov '26</span></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="stat-success">0</div><div class="stat-l">Success Days</div></div>
        <div class="stat"><div class="stat-n" id="stat-plans">0</div><div class="stat-l">Total Plans</div></div>
        <div class="stat"><div class="stat-n" id="stat-remain">0</div><div class="stat-l">Days Left</div></div>
        <div class="stat"><div class="stat-n" id="stat-streak">0</div><div class="stat-l">Streak</div></div>
      </div>
    </div>
    <div class="tab-row" id="tab-row">
      <button class="tab-btn active" data-tab="calendar">Calendar</button>
      <button class="tab-btn" data-tab="friends">Friends</button>
      <button class="tab-btn" data-tab="breakdown">Breakdown</button>
      <button class="tab-btn" data-tab="insights">✦ Insights</button>
      <button class="tab-btn" id="gcal-btn" title="Connect Google Calendar" style="margin-left:auto;color:rgba(160,200,255,0.8);border-color:rgba(160,200,255,0.2)">+ GCal</button>
    </div>
  </header>
  <div class="main">
    <div class="months-wrap" id="months-wrap">
      <div class="months-nav">
        <button class="nav-btn" id="nav-prev">←</button>
        <span id="nav-range">Sep – Oct</span>
        <button class="nav-btn" id="nav-next">→</button>

      <div class="months" id="months"></div>
    </div>
    <div class="panel-wrap" id="panel-wrap">
      <div class="panel" id="panel">
        <div class="panel-empty"><div class="panel-empty-icon">🍂</div><div class="panel-empty-text">Pick a day to plan something</div></div>
      </div>
    </div>
  </div>
  <footer class="legend">
    <div class="leg-item"><span class="leg-dot" style="background:var(--upstate)"></span>Upstate</div>
    <div class="leg-item"><span class="leg-dot" style="background:var(--fair)"></span>Fair</div>
    <div class="leg-item"><span class="leg-dot" style="background:var(--halloween)"></span>Halloween</div>
    <div class="leg-item"><span class="leg-dot" style="background:var(--friendsgiving)"></span>Friendsgiving</div>
    <div class="leg-item"><span class="leg-dot" style="background:var(--other)"></span>Other</div>
